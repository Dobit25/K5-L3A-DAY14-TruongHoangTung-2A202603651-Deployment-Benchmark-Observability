name: Day 14 retrieval quality
on: pull_request
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Compare v2 with the trusted base-branch baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AGENT_VERSION: v2
          MOCK_ERROR_RATE: "0"
          PORT: "8002"
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git show "${BASE_SHA}:reports/eval_v2.json" > "$RUNNER_TEMP/baseline.json"
          python app.py > "$RUNNER_TEMP/agent.log" 2>&1 &
          agent_pid=$!
          trap 'kill "$agent_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://localhost:8002/health
          python eval/run_eval.py --url http://localhost:8002 --min-accuracy 0.85 --baseline "$RUNNER_TEMP/baseline.json"
